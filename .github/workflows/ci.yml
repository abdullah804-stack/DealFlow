name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python — imports and self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run canonical_key self-test
        run: python -m src.memory.canonical_key

      - name: Verify all Python imports resolve
        run: |
          python -c "import src.memory"
          python -c "import src.agents.discovery_agent"
          python -c "import src.agents.validation_agent"
          python -c "import src.agents.dossier_builder"
          python -c "import src.agents.investor_agent"
          python -c "import src.agents.moderator_agent"
          python -c "import src.agents.voting"
          python -c "import src.agents.report_generator"
          python -c "import src.orchestration.daily_cycle"
          python -c "import src.scheduler.run_cycle"
          python -c "import src.evaluation.backtest"
          python -c "import src.evaluation.scorecard"
          python -c "import src.llm.client"
          python -c "import src.sources.hackernews_source"
          python -c "import src.sources.reddit_source"
          python -c "import src.sources.rss_source"
          echo "All imports OK"

  typescript:
    name: TypeScript — typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: "true"


  voting-parity:
    name: Voting parity (Python vs TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Run Python parity fixture
        run: python tests/test_voting_parity.py > /tmp/py-parity.txt

      - name: Run TS parity fixture
        run: npx tsx tests/voting_parity.ts > /tmp/ts-parity.txt

      - name: Compare outputs
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def extract(path):
              text = Path(path).read_text()
              m = re.search(
                  r"VOTING_PARITY_JSON_START\s*(.*?)\s*VOTING_PARITY_JSON_END",
                  text,
                  re.DOTALL,
              )
              if not m:
                  raise SystemExit(f"No parity block found in {path}")
              return json.loads(m.group(1))

          py = extract("/tmp/py-parity.txt")
          ts = extract("/tmp/ts-parity.txt")

          # Normalize: sort by name for comparison
          def norm(rows):
              return sorted(
                  [{"name": r["name"],
                    "weightedTotal": round(r["weightedTotal"], 4),
                    "decision": r["decision"],
                    "fastPath": r["fastPath"]} for r in rows],
                  key=lambda x: x["name"],
              )

          if norm(py) != norm(ts):
              print("MISMATCH")
              print("PY:", json.dumps(norm(py), indent=2))
              print("TS:", json.dumps(norm(ts), indent=2))
              raise SystemExit(1)

          print("Voting parity OK:", len(py), "cases matched")
          PY

  canonical-parity:
    name: Canonical key parity (Python vs TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Run Python canonical fixture
        run: python tests/test_canonical_parity.py > /tmp/py-canon.txt

      - name: Run TS canonical fixture
        run: npx tsx tests/canonical_parity.ts > /tmp/ts-canon.txt

      - name: Compare keys
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def extract(path):
              text = Path(path).read_text()
              m = re.search(
                  r"CANONICAL_PARITY_JSON_START\s*(.*?)\s*CANONICAL_PARITY_JSON_END",
                  text,
                  re.DOTALL,
              )
              if not m:
                  raise SystemExit(f"No parity block found in {path}")
              return json.loads(m.group(1))

          py = extract("/tmp/py-canon.txt")
          ts = extract("/tmp/ts-canon.txt")

          if len(py) != len(ts):
              print(f"MISMATCH: length {len(py)} vs {len(ts)}")
              raise SystemExit(1)

          for i, (p, t) in enumerate(zip(py, ts)):
              if p.get("key") != t.get("key"):
                  print(f"MISMATCH at case {i}:")
                  print(f"  input:  {p.get('input')}")
                  print(f"  python: {p.get('key')!r}")
                  print(f"  ts:     {t.get('key')!r}")
                  raise SystemExit(1)
              if (p.get("error") is None) != (t.get("error") is None):
                  print(f"ERROR-STATE MISMATCH at case {i}: {p} vs {t}")
                  raise SystemExit(1)

          print(f"Canonical key parity OK: {len(py)} cases matched")
          PY