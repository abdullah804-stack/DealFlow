name: VentureScout AI Daily Cycle

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run_cycle:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Install dependencies (with cache)
        run: |
          pip install --no-cache-dir numpy
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt
      
      - name: Run daily cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m src.scheduler.run_cycle
      
      - name: Commit results
        run: |
          git config user.name "VentureScout Bot"
          git config user.email "bot@venturescout-ai.com"
          git add data/
          git commit -m "Auto-update: daily cycle results" || echo "No changes"
          git push